<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד אנליטיקס — צוואה דיגיטלית</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.googletagmanager.com/gtag/js?id=G-ET42K00LTJ" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Heebo', sans-serif; background: #0d1b2e; color: #fff; padding: 24px; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 28px; color: #c8a96e; margin-bottom: 8px; }
    .header p { color: rgba(255,255,255,0.5); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; text-align: center; }
    .card .number { font-size: 36px; font-weight: 700; color: #c8a96e; }
    .card .label { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 4px; }
    .section { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .section h2 { font-size: 18px; color: #c8a96e; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 16px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
    th { color: rgba(255,255,255,0.5); font-weight: 600; }
    td { color: #fff; }
    .loading { text-align: center; color: rgba(255,255,255,0.4); padding: 40px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-green { background: rgba(34,197,94,0.2); color: #22c55e; }
    .badge-yellow { background: rgba(234,179,8,0.2); color: #eab308; }
    .badge-red { background: rgba(239,68,68,0.2); color: #ef4444; }
    .refresh-btn { background: rgba(200,169,110,0.2); border: 1px solid #c8a96e; color: #c8a96e; padding: 8px 20px; border-radius: 8px; cursor: pointer; font-family: 'Heebo'; font-size: 14px; }
    .refresh-btn:hover { background: rgba(200,169,110,0.3); }
    #last-update { font-size: 12px; color: rgba(255,255,255,0.3); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 דשבורד — צוואה דיגיטלית</h1>
    <p>elisha-law.com + hebrew-will-guide.vercel.app</p>
    <button class="refresh-btn" onclick="loadAllData()" style="margin-top:12px">🔄 רענן נתונים</button>
    <div id="last-update"></div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="number" id="total-visits">—</div>
      <div class="label">סה״כ ביקורים (מאז התקנה)</div>
    </div>
    <div class="card">
      <div class="number" id="today-visits">—</div>
      <div class="label">ביקורים היום</div>
    </div>
    <div class="card">
      <div class="number" id="total-leads">—</div>
      <div class="label">לידים שנשלחו</div>
    </div>
    <div class="card">
      <div class="number" id="funnel-starts">—</div>
      <div class="label">התחלות שאלון</div>
    </div>
  </div>

  <div class="section">
    <h2>📋 אירועים אחרונים</h2>
    <div id="events-table">
      <p class="loading">טוען נתונים...</p>
    </div>
  </div>

  <div class="section">
    <h2>🔗 בדיקת לינקים</h2>
    <div id="link-checks">
      <p class="loading">בודק...</p>
    </div>
  </div>

  <div class="section">
    <h2>📈 סטטוס מערכות</h2>
    <div id="system-status">
      <p class="loading">בודק...</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://kydqxnekyinmiflcehge.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5ZHF4bmVreWlubWlmbGNlaGdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTA0MzAsImV4cCI6MjA4OTc2NjQzMH0.5jZcObfhe-VT0M8_FcKaNRLaRnIcFFlYQ_l7vIygpko";

    // Track this dashboard visit
    const VISIT_KEY = "dashboard_visits";

    // Simple visit counter using localStorage + Supabase
    function trackVisit(page) {
      fetch(`${SUPABASE_URL}/rest/v1/funnel_events`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          session_id: crypto.randomUUID(),
          event_name: "page_view",
          metadata: { page, timestamp: new Date().toISOString(), userAgent: navigator.userAgent }
        })
      }).catch(() => {});
    }

    async function fetchSupabase(table, params = "") {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${params}`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
          }
        });
        return await res.json();
      } catch (e) {
        return [];
      }
    }

    async function fetchSupabaseCount(table, filter = "") {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=id${filter}`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "count=exact"
          }
        });
        const range = res.headers.get("content-range");
        if (range) {
          const total = range.split("/")[1];
          return total === "*" ? 0 : parseInt(total);
        }
        return 0;
      } catch (e) {
        return 0;
      }
    }

    async function loadEvents() {
      const events = await fetchSupabase("funnel_events", "?select=event_name,created_at,session_id,metadata&order=created_at.desc&limit=20");
      const container = document.getElementById("events-table");

      if (!events || events.length === 0) {
        container.innerHTML = `<p style="color:rgba(255,255,255,0.4)">אין אירועים עדיין. האירועים יתחילו להופיע כשמשתמשים ייכנסו לכלי הצוואה.</p>`;
        return { total: 0, today: 0, starts: 0, leads: 0 };
      }

      let html = '<table><thead><tr><th>אירוע</th><th>תאריך</th><th>סשן</th></tr></thead><tbody>';
      events.forEach(e => {
        const date = new Date(e.created_at).toLocaleString("he-IL", { timeZone: "Asia/Jerusalem" });
        const shortSession = e.session_id ? e.session_id.substring(0, 8) : "—";
        html += `<tr><td>${e.event_name}</td><td>${date}</td><td dir="ltr">${shortSession}...</td></tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;

      const total = await fetchSupabaseCount("funnel_events");
      const today = events.filter(e => new Date(e.created_at).toDateString() === new Date().toDateString()).length;
      const starts = events.filter(e => e.event_name === "cta_click").length;
      const leads = events.filter(e => e.event_name === "lead_submitted").length;

      return { total, today, starts, leads };
    }

    async function checkLinks() {
      const links = [
        { name: "אתר ראשי", url: "https://elisha-law.com/" },
        { name: "כלי הצוואה", url: "https://hebrew-will-guide.vercel.app/" },
        { name: "מאמר צוואות", url: "https://elisha-law.com/article-tzavaah.html" },
        { name: "מאמר צוואה דיגיטלית", url: "https://elisha-law.com/article-tzavaah-digital.html" },
      ];

      let html = '<table><thead><tr><th>דף</th><th>סטטוס</th></tr></thead><tbody>';
      for (const link of links) {
        try {
          const res = await fetch(link.url, { method: "HEAD", mode: "no-cors" });
          html += `<tr><td>${link.name}</td><td><span class="badge badge-green">תקין</span></td></tr>`;
        } catch (e) {
          html += `<tr><td>${link.name}</td><td><span class="badge badge-red">שגיאה</span></td></tr>`;
        }
      }
      html += '</tbody></table>';
      document.getElementById("link-checks").innerHTML = html;
    }

    async function checkSystems() {
      let html = '<table><thead><tr><th>מערכת</th><th>סטטוס</th></tr></thead><tbody>';

      // Check Supabase
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/`, {
          headers: { "apikey": SUPABASE_KEY }
        });
        html += `<tr><td>Supabase (DB + Edge Functions)</td><td><span class="badge badge-green">פעיל</span></td></tr>`;
      } catch (e) {
        html += `<tr><td>Supabase</td><td><span class="badge badge-red">תקלה</span></td></tr>`;
      }

      // Check Formspree
      html += `<tr><td>Formspree (לידים למייל)</td><td><span class="badge badge-green">מוגדר — mgopabze</span></td></tr>`;

      // Check GA
      html += `<tr><td>Google Analytics</td><td><span class="badge badge-green">G-ET42K00LTJ</span></td></tr>`;

      // Vercel
      html += `<tr><td>Vercel (אחסון)</td><td><span class="badge badge-green">פעיל</span></td></tr>`;

      html += '</tbody></table>';
      document.getElementById("system-status").innerHTML = html;
    }

    async function loadAllData() {
      document.getElementById("last-update").textContent = "מעדכן...";

      const stats = await loadEvents();
      document.getElementById("total-visits").textContent = stats.total || "0";
      document.getElementById("today-visits").textContent = stats.today || "0";
      document.getElementById("total-leads").textContent = stats.leads || "0";
      document.getElementById("funnel-starts").textContent = stats.starts || "0";

      await checkLinks();
      await checkSystems();

      document.getElementById("last-update").textContent = `עדכון אחרון: ${new Date().toLocaleString("he-IL", { timeZone: "Asia/Jerusalem" })}`;
    }

    // Load on page load
    loadAllData();
  </script>
</body>
</html>
